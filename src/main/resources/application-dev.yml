# ============================================================
# Spring 核心配置
# ============================================================
spring:
  # ---------- 数据源配置（连接数据库） ----------
  datasource:
    # 数据库驱动（MySQL 8.x 用这个）
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接地址：localhost:3306 是 MySQL 默认地址和端口
    # your_database 替换成你真正的数据库名
    # useSSL=false 关闭 SSL（开发环境用）
    # serverTimezone=Asia/Shanghai 设置时区（和中国时间一致）
    # characterEncoding=utf8 设置编码（支持中文）
    # allowPublicKeyRetrieval=true 解决某些 MySQL 8.0 的加密问题
    url: jdbc:mysql://localhost:3306/mydb?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    # 数据库用户名（默认是 root）
    username: root
    # 数据库密码（替换成你自己的密码）
    password: ${MYSQL_PASSWORD}   # 注意：有特殊字符时加双引号

  # ---------- 新增 Redis 配置 ----------
  redis:
    host: localhost   # Redis 服务器地址（默认是本机）
    port: 6379        # Redis 端口（默认是 6379）
    password:         # 如果没有密码，留空
    database: 0       # 使用的数据库索引（0-15）
    timeout: 3000ms   # 连接超时时间
    lettuce:
      pool:
        max-active: 8   # 连接池最大连接数
        max-idle: 8     # 最大空闲连接
        min-idle: 0     # 最小空闲连接

  mail:
    host: smtp.qq.com
    port: 465
    username: 1477143144@qq.com
    password: ${MAIL_AUTHORIZATION_CODE}
    protocol: smtps
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            trust: smtp.qq.com


# ============================================================
# MyBatis 配置
# ============================================================
mybatis:
  # ---------- 告诉 MyBatis 去哪找 XML 映射文件 ----------
  # classpath:mapper/*.xml 表示 src/main/resources/mapper/ 目录下的所有 .xml 文件
  mapper-locations: classpath:mapper/*.xml

  # ---------- 实体类别名包 ----------
  # 设置后，XML 里可以直接写 User，不用写 com.example.entity.User 全路径
  type-aliases-package: com.example.entity

  # ---------- MyBatis 行为配置 ----------
  configuration:
    # ⭐ 最关键的配置：开启驼峰命名自动映射
    # 数据库字段是下划线（如 create_time）时，自动映射到 Java 驼峰属性（createTime）
    # 这样你就不需要写繁琐的 resultMap 了
    map-underscore-to-camel-case: true

# ============================================================
# 日志配置（方便调试，可以看到 MyBatis 执行的 SQL）
# ============================================================
logging:
  level:
    # 把 com.example.mapper 包的日志级别设为 DEBUG
    # 这样控制台会打印 MyBatis 执行的 SQL 语句和参数
    com.example.mapper: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{traceId}] %-5level %logger{36} - %msg%n"

jwt:
  secret: ${JWT_SECRET:abcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+}
  access-expire-time: 3600000  #一小时    单位毫秒
  refresh-expire-time: 2592000000 #30天  单位毫秒


